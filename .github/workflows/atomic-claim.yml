name: Atomic claim regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime version
        run: node --version
      - name: Atomic claim and adapter integration tests
        run: node --test atomic-ledger.test.js adapter-integration.test.js pinned-executor.test.js
